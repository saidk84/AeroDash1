name: AeroDash V02 Android APK

on:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Validate Unity credentials
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] && { [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; }; then
            echo "Configure UNITY_LICENSE or UNITY_EMAIL + UNITY_PASSWORD in repository secrets."
            exit 1
          fi
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: V02
          targetPlatform: Android
          buildMethod: AeroDashAndroidBuild.BuildAndroid
          versioning: None
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AeroDash-V02-Android-APK
          path: V02/Builds/Android/AeroDash-V02.apk
          if-no-files-found: error
